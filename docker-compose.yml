services:
  web:
    container_name: moedin_web
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next_cache:/app/.next
    command: sh -c "mkdir -p .next && find .next -mindepth 1 -maxdepth 1 -exec rm -rf {} + && npm install && npm run dev -- --hostname 0.0.0.0 --port 3333"
    ports:
      - "3333:3333"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_AI_URL: http://localhost:8000
      NEXT_PUBLIC_N8N_URL: http://localhost:5678
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      - api
      - ai
    restart: unless-stopped

  api:
    container_name: moedin_api
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./apps/api:/app
      - api_node_modules:/app/node_modules
    command: sh -c "npm install && npx tsx watch src/server.ts"
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      HOST: 0.0.0.0
    restart: unless-stopped

  ai:
    container_name: moedin_ai
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./apps/ai-service:/app
    command: sh -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: 1
    restart: unless-stopped

  n8n:
    container_name: moedin_n8n
    image: n8nio/n8n:latest
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:5678}
      WEBHOOK_URL: ${N8N_WEBHOOK_BASE_URL:-http://localhost:5678}
      GENERIC_TIMEZONE: ${DEFAULT_TIMEZONE:-America/Sao_Paulo}
      TZ: ${DEFAULT_TIMEZONE:-America/Sao_Paulo}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-moedin_local_change_me_32_chars_key}
      DB_SQLITE_POOL_SIZE: 2
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_RUNNERS_ENABLED: "true"
      N8N_GIT_NODE_DISABLE_BARE_REPOS: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "false"
      SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://host.docker.internal:8000}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-evolution}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-BRL}
    volumes:
      - ./n8n/data:/home/node/.n8n
      - ./n8n/workflow:/workflows
      - ./n8n/files:/files
    restart: unless-stopped

volumes:
  web_node_modules:
  web_next_cache:
  api_node_modules:
